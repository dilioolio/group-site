name = "group-site"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static frontend lives in /public and is served by the Worker (single deploy).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# Route ALL requests through the Worker so the security-headers middleware and
# the first-run /setup gate apply to static pages too.
run_worker_first = true

# Bundle schema.sql as a string so the Worker can create its own tables on the
# first request (src/lib/config.js) — no `wrangler d1 execute` step for the user.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# D1 database. No database_id: the "Deploy to Cloudflare" button (and
# `wrangler deploy` on newer CLIs) provisions one automatically and fills it in.
[[d1_databases]]
binding = "DB"
database_name = "group-site-db"

# Workers KV for event images, member photos and site assets (icon, backgrounds).
# KV instead of R2 because R2 needs a credit card on file; KV's free tier
# (1 GB, 100k reads/day, 1k writes/day) is plenty for one group.
[[kv_namespaces]]
binding = "PHOTOS"

# Daily cleanup of expired member photos + rate-limit rows (03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

# Tunables. Everything user-facing (password, names, Resend key, timezone,
# colours) lives in the D1 `config` table and is set from /setup and the admin
# Settings page — there are no secrets to `wrangler secret put`.
[vars]
MEMBER_PHOTO_MAX_BYTES = "8388608"      # 8 MB
MEMBER_PHOTO_PER_EVENT_CAP = "200"
MEMBER_PHOTO_PER_UPLOADER_CAP = "30"
GALLERY_TOKEN_TTL_DAYS = "30"
ADMIN_SESSION_TTL_HOURS = "12"
