<!doctype html>
<html lang="en" data-type="serif" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Group Site</title>
  <meta name="theme-color" content="#2C6A49">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* Page-scoped tweaks layered on top of the shared design system. */
    .feature .lede { margin: 0; }
    .feature .factline .ico { color: var(--pine); }
    .feature .actions .btn { white-space: nowrap; }
    .going { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .event-card { color: inherit; }
    .event-card .scene { display: block; }
    .event-card .scene img { width: 100%; height: 100%; object-fit: cover; }

    .empty-filler { padding: 18px 22px; color: var(--muted); font-size: 14.5px; text-align: center; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/"><span class="seal" data-site-seal>✦</span><b data-site-name>Group Site</b></a>
    <nav class="navset">
      <a class="hide-sm" href="#upcoming">Upcoming</a>
      <a class="hide-sm" href="#previous">Past events</a>
      <a class="cta" href="/admin">Admin</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap section" id="loading-wrap"><p id="loading" class="muted">Loading…</p></div>

  <!-- Category filter (hidden when the site has a single category) -->
  <section class="section" id="cat-section" style="padding-bottom:0;display:none">
    <div class="wrap"><div class="tabbar" id="cat-tabs" style="margin-bottom:0"></div></div>
  </section>

  <!-- Featured (today's event, or first upcoming if none today) -->
  <section class="section" id="featured-section" style="padding-bottom:14px;display:none">
    <div class="wrap">
      <div class="eyebrow persimmon" id="featured-eyebrow" style="margin-bottom:14px"><span class="dot"></span> Next up</div>
      <article class="feature" id="featured-card"></article>
    </div>
  </section>

  <!-- Upcoming -->
  <section class="section" id="upcoming" style="display:none">
    <div class="wrap">
      <div class="shead">
        <h2 class="display">Upcoming</h2>
      </div>
      <div class="grid-3" data-bucket="upcoming"></div>
      <p class="empty-filler" data-empty="upcoming" hidden>No upcoming events yet — check back soon.</p>
    </div>
  </section>

  <svg class="ridge" viewBox="0 0 1200 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26 L150 12 L300 24 L470 6 L640 22 L800 10 L960 22 L1120 8 L1200 18"/></svg>

  <!-- Previous (recent memories) -->
  <section class="section" id="previous" style="display:none">
    <div class="wrap">
      <div class="shead">
        <h2 class="display">Recent memories</h2>
      </div>
      <div class="grid-3" data-bucket="previous"></div>
      <p class="empty-filler" data-empty="previous" hidden>No previous events to show.</p>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="brand"><span class="seal" data-site-seal>✦</span><b data-site-name>Group Site</b></div>
    <span class="muted">Self-hosted · photos auto-expire 30 days after each event</span>
  </div>
</footer>

<script src="/scenes.js"></script>

<script type="module">
  import { api, formatDate, loadSite } from "/js/common.js";

  const loading = document.getElementById("loading");
  const loadingWrap = document.getElementById("loading-wrap");

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  }
  function snippet(text, max = 140) {
    const s = String(text || "").replace(/\s+/g, " ").trim();
    return s.length > max ? s.slice(0, max - 1) + "…" : s;
  }
  function bucketFor(eventDate) {
    const d = new Date(eventDate);
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfTomorrow = new Date(startOfToday.getTime() + 86400000);
    if (d >= startOfToday && d < startOfTomorrow) return "today";
    if (d >= startOfTomorrow) return "upcoming";
    return "previous";
  }

  // Deterministic scene per event so the same event always shows the same fallback art.
  const SCENES = ["dawn", "day", "dusk", "forest", "night"];
  function sceneFor(idStr, salt = 0) {
    let h = 0;
    const s = String(idStr || "x");
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return { scene: SCENES[(h + salt) % SCENES.length], seed: ((h >> 3) + salt * 7) % 1000 || 1 };
  }

  // For the .f-scene container: build the <a class="scene"> with either a real
  // image overlay or a generative scene painted by scenes.js. Inline width/height
  // on the img is required because the .feature .f-scene .scene rule pins it absolute.
  function featuredSceneAttrs(ev) {
    const { scene, seed } = sceneFor(ev.id);
    return `data-scene="${scene}" data-seed="${seed}"`;
  }
  // Organiser photo, else the category's image (Settings → Categories), else generative scene.
  function heroSrc(ev) {
    return ev.primary_image_key ? `/img/${ev.primary_image_key}` : (catById[ev.category]?.image || null);
  }
  function featuredImageOverlay(ev) {
    if (!heroSrc(ev)) return "";
    return `<img src="${heroSrc(ev)}" alt="${escapeHtml(ev.title)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1">`;
  }

  function shortDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
    catch { return iso; }
  }
  function timeOnly(iso) {
    try { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
    catch { return ""; }
  }

  function renderFeatured(ev) {
    const sec = document.getElementById("featured-section");
    const card = document.getElementById("featured-card");
    const eyebrow = document.getElementById("featured-eyebrow");
    const today = bucketFor(ev.event_date) === "today";
    eyebrow.innerHTML = `<span class="dot"></span> Next up · ${today ? "Today" : "Upcoming"}`;

    card.innerHTML = `
      <div class="f-scene">
        <a class="scene" href="/event/${ev.id}" ${featuredSceneAttrs(ev)}>
          ${featuredImageOverlay(ev)}
          ${ev.location ? `<span class="label" style="z-index:2">${escapeHtml(ev.location)}</span>` : ""}
        </a>
      </div>
      <div class="f-body">
        <h1 class="display">${escapeHtml(ev.title)}</h1>
        <p class="lede">${escapeHtml(snippet(ev.description, 160))}</p>
        <div class="stack" style="gap:9px;margin-top:2px">
          <div class="factline">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M3 9h18M8 3v4M16 3v4"></path></svg></span>
            ${escapeHtml(shortDate(ev.event_date))} · ${escapeHtml(timeOnly(ev.event_date))}
          </div>
          ${ev.location ? `<div class="factline">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.6"></circle></svg></span>
            Meet at ${escapeHtml(ev.location)}
          </div>` : ""}
        </div>
        <div class="going" style="margin-top:6px">
          <span class="chip"><span class="dot"></span> ${ev.rsvp_count} going</span>
        </div>
        <div class="actions">
          <a class="btn lg" href="/event/${ev.id}">RSVP — I'm going</a>
          <a class="btn ghost lg" href="/event/${ev.id}">View details</a>
        </div>
      </div>
    `;
    sec.style.display = "block";
    if (window.paintScenes) window.paintScenes();
  }

  function renderCard(ev, opts = {}) {
    const isCancelled = ev.status === "cancelled";
    const isPrevious = opts.bucket === "previous";
    const sceneClass = isCancelled ? "scene cancelled" : "scene";
    const label = ev.location || "";
    const inner = heroSrc(ev)
      ? `<img src="${heroSrc(ev)}" alt="${escapeHtml(ev.title)}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">
         ${label ? `<span class="label">${escapeHtml(label)}</span>` : ""}`
      : (() => {
          const { scene, seed } = sceneFor(ev.id);
          return `<svg style="display:none"></svg><!--placeholder--><span data-scene-fill="${scene}" data-scene-seed="${seed}"></span>
                  ${label ? `<span class="label">${escapeHtml(label)}</span>` : ""}`;
        })();

    const daysSinceEvent = (Date.now() - new Date(ev.event_date).getTime()) / 86400000;
    const catChip = site.categories.length > 1 && catById[ev.category]
      ? `<span class="chip neutral" style="margin-right:6px">${escapeHtml(catById[ev.category].name)}</span>` : "";
    const rowRight = isPrevious
      ? (isCancelled
          ? `<span class="chip persimmon">cancelled</span>`
          : (daysSinceEvent <= 30 ? `<span class="chip neutral">photos available</span>` : ""))
      : `<span class="chip"><span class="dot"></span> ${ev.rsvp_count} going</span>`;

    const card = document.createElement("a");
    card.className = "card event-card";
    card.href = `/event/${ev.id}`;
    if (heroSrc(ev)) {
      card.innerHTML = `
        <div class="${sceneClass}" style="position:relative">
          ${inner}
        </div>
        <div class="c-pad">
          <h3>${escapeHtml(ev.title)}</h3>
          <div class="meta">${escapeHtml(shortDate(ev.event_date))} · ${escapeHtml(timeOnly(ev.event_date))}${ev.location ? " · " + escapeHtml(ev.location) : ""}</div>
          <div class="row">
            <span class="meta" style="font-size:13.5px">${catChip}${isPrevious ? `${ev.rsvp_count} went` : ""}</span>
            ${rowRight}
          </div>
        </div>
      `;
    } else {
      const { scene, seed } = sceneFor(ev.id);
      card.innerHTML = `
        <div class="${sceneClass}" data-scene="${scene}" data-seed="${seed}">
          ${label ? `<span class="label">${escapeHtml(label)}</span>` : ""}
        </div>
        <div class="c-pad">
          <h3>${escapeHtml(ev.title)}</h3>
          <div class="meta">${escapeHtml(shortDate(ev.event_date))} · ${escapeHtml(timeOnly(ev.event_date))}${ev.location ? " · " + escapeHtml(ev.location) : ""}</div>
          <div class="row">
            <span class="meta" style="font-size:13.5px">${catChip}${isPrevious ? `${ev.rsvp_count} went` : ""}</span>
            ${rowRight}
          </div>
        </div>
      `;
    }
    return card;
  }

  // Category tabs: a filter, not a gate. Choice remembered per browser.
  const site = await loadSite();
  const catById = Object.fromEntries(site.categories.map((c) => [c.id, c]));
  let activeCat = localStorage.getItem("cat_filter") || "all";
  if (activeCat !== "all" && !catById[activeCat]) activeCat = "all";
  if (site.categories.length > 1) {
    const tabs = document.getElementById("cat-tabs");
    tabs.innerHTML = [{ id: "all", name: "All" }, ...site.categories]
      .map((c) => `<div class="t${c.id === activeCat ? " on" : ""}" data-cat="${c.id}">${escapeHtml(c.name)}</div>`).join("");
    document.getElementById("cat-section").style.display = "block";
    tabs.addEventListener("click", (e) => {
      const t = e.target.closest("[data-cat]"); if (!t) return;
      activeCat = t.dataset.cat; localStorage.setItem("cat_filter", activeCat);
      tabs.querySelectorAll(".t").forEach((x) => x.classList.toggle("on", x === t));
      render();
    });
  }

  let allEvents = [];
  function render() {
    const events = activeCat === "all" ? allEvents : allEvents.filter((ev) => ev.category === activeCat);
    for (const id of ["featured-section", "upcoming", "previous"]) document.getElementById(id).style.display = "none";
    document.querySelectorAll("[data-bucket]").forEach((g) => { g.innerHTML = ""; });
    document.querySelectorAll("[data-empty]").forEach((p) => { p.hidden = true; });

    const buckets = { today: [], upcoming: [], previous: [] };
    for (const ev of events) buckets[bucketFor(ev.event_date)].push(ev);
    buckets.previous.reverse(); // events come back ASC — flip so newest-past is first

    // Featured slot: today's first event, or the next upcoming. Falls back to nothing.
    const featured = buckets.today[0] || buckets.upcoming[0] || null;
    if (featured) {
      renderFeatured(featured);
      // Don't duplicate the featured event in its bucket grid.
      if (buckets.today[0] === featured) buckets.today.shift();
      else buckets.upcoming.shift();
    }

    // "Upcoming" = remaining today + remaining upcoming.
    const upcomingMix = [...buckets.today, ...buckets.upcoming];
    const upSec = document.getElementById("upcoming");
    const upGrid = document.querySelector('[data-bucket="upcoming"]');
    const upEmpty = document.querySelector('[data-empty="upcoming"]');
    upSec.style.display = "block";
    if (upcomingMix.length === 0) upEmpty.hidden = false;
    else for (const ev of upcomingMix) upGrid.appendChild(renderCard(ev, { bucket: "upcoming" }));

    const prevSec = document.getElementById("previous");
    const prevGrid = document.querySelector('[data-bucket="previous"]');
    const prevEmpty = document.querySelector('[data-empty="previous"]');
    prevSec.style.display = "block";
    if (buckets.previous.length === 0) prevEmpty.hidden = false;
    else for (const ev of buckets.previous) prevGrid.appendChild(renderCard(ev, { bucket: "previous" }));

    if (window.paintScenes) window.paintScenes();
  }

  try {
    ({ events: allEvents } = await api("/api/events"));
    loadingWrap.style.display = "none";
    render();
  } catch (err) {
    loading.textContent = "Couldn't load events: " + err.message;
  }
</script>

</body>
</html>
